# Configuration for lint_workbook.py. Every value has a default, so a project can run the
# linter with no config at all; this file exists to point it at your layout and to
# teach it the names your project actually uses.
#
# Command-line flags win over this file:
#   python tools/lint_workbook.py --docs project-workbook --profile research

[profile]
# "engineering" or "research". The research profile turns on the experiment register,
# the run-configuration register, the plan/ checks and the measurement contract.
name = "engineering"

[project]
# Size tier: "S", "M" or "L" — see RULES.md, "Tiers and scaling". Counted from the number
# of areas a session has to hold in its head, which in practice is the number of subsystem
# pages the project has earned. It adjusts the limits below and which files are expected,
# and nothing else: triggers, entry formats and the hard rules are the same at every tier.
tier = "S"

[paths]
root = ".."                   # project root, relative to this file's directory
docs = "project-workbook"
method = "workbook-method"     # local method folder, if the project has one
corpus = "project-workbook/corpus.md"  # research only; put it where a measurer will look
baseline = ""                 # research only, e.g. "tools/bench/baseline"
extra_doc_dirs = []           # other markdown the linter is responsible for, e.g. ["tools"]
# Directories inside docs/ holding register entries once a register has been split by
# area (RULES.md, "Scaling"): the register file keeps the index, the bodies live here.
# Empty means every register is a single file.
register_bodies = []
# Prefixes a local method numbers its departures with. "D" is the standard's own. A
# project that borrowed departures from a sibling and added its own numbers the two apart
# — and since borrowed ones collapse once they are promoted into the standard, the rest
# cannot be renumbered without breaking live [[links]]. List every prefix in use.
delta_prefixes = ["D"]
# A documented path is tried against these roots first. Failing that it is looked for as
# the tail of any path in the tree, because documentation names a file the way a person
# does — `model/Screen.kt`, not the full path from a source root nobody writes out. List
# a root here only to make the common case cheap, not to constrain how paths are written.
path_roots = ["", "project-workbook"]
# Never searched when resolving a documented path. A generated tree is far larger than the
# source it came from, and a path found only inside one is not evidence that the file the
# documents mean still exists.
ignore_dirs = [".git", "node_modules", "build", "target", "dist", ".cxx", ".gradle",
               ".idea", "__pycache__", "venv", ".venv"]
root_pointers = ["AGENTS.md", "CLAUDE.md", ".cursorrules", ".github/copilot-instructions.md"]
# The file for a person joining the project (check 21). "" turns the check off, for a
# document set nobody else will join.
onboarding = "ONBOARDING.md"
# Paths that legitimately do not exist: an artefact the docs declare as not yet written,
# a file in someone else's repository, a build output that only exists after a build.
# Keep the reason beside each one.
allow = []

[registers]
# prefix -> file inside docs/. E is ignored outside the research profile. This table
# replaces the default set rather than extending it, so a document set with its own
# prefixes (say EG and ED) lists only those. A prefix may be more than one letter.
G = "gotchas.md"
A = "architecture.md"
E = "experiments.md"

[limits]
# Anything set here wins over the tier's value, so setting a limit pins it. `status.md`
# is the one the tier moves — 80 at S and M, 120 at L — so it is left to the tier by
# default; uncomment it only to hold this project to a figure of its own.
"start.md" = 100
# "status.md" = 80
# Which limits are errors rather than advice. Keep this short. A limit earns a place
# here by *forcing* something: status.md's exists to refuse an append-only chronicle, so
# that the chronicle goes to journal.md instead of crowding out the state. No limit here
# is defending a context budget — measured across six document sets, everything a
# session always reads comes to roughly 6k tokens, about 3 % of a 200K window.
enforce = ["status.md"]
# A glob covers every matching file under docs/ and warns rather than errors — such
# files grow by design, and the limit says when to split one:
# "subsystems/*.md" = 150
# Past this many entries an index stops being scannable and the register should be split
# by area under one top-level index. A warning, not an error: the system should tell you
# when to split rather than you guessing.
register_split_warn = 60

[numbers]
# Research only. Files where results are reported; plan/*.md legitimately states target
# numbers with no measurement behind them yet, and gotchas describe symptoms.
result_files = ["status.md", "journal.md", "experiments.md", "overview.md"]
units = ["ms", "MB/s", "fps", "%", "s"]
# A figure does not stop being a measurement because its unit was left off. List the
# metric names your project reports, so "p50 fell from 33.70 to 31.02" is caught too.
metric_names = ["p50", "p95", "p99", "frametime"]
# Phrases that excuse a number: thresholds, run settings, stated targets. Each should
# carry the reason it is not a traceable measurement.
allow = [
  "acceptance criterion",  # states a target, not a result
  "threshold",             # describes the harness, not a measurement
]

[measurement]
# Research only. Fields every stored report must carry; null is a legitimate value
# (a baseline has no experiment), a missing key is not.
required_fields = ["corpus_id", "experiment", "compare_to", "run_order"]
id_field = "corpus_id"
# Prefix used in [[<prefix>:<id>]] links to a run configuration. Projects that measure
# something other than a corpus name it differently: "scene", "dataset", "workload".
link_prefix = "corpus"
raw_dir = "raw"   # holds the reports a baseline was curated from; not stored measurements

[labels]
# Field labels as they appear in your documents. The standard is written in English, but
# a project may keep its documents in another language (METHODOLOGY.md, section 5).
# Leaving these at the English defaults on, say, a Russian-language document set silently
# disables the prediction and status checks — they find no matching block and report
# nothing, which looks exactly like passing.
prediction = "Prediction"
status = "Status"
status_open = "open"
status_refuted = "refuted"
acceptance_criterion = "Acceptance criterion"

[tasks]
# Research only. Shape of a task id as it appears in the backlog table.
id_pattern = "[A-Z]-[0-9a-z]+"
backlog = "plan/backlog.md"
plan_dir = "plan"
# The line in backlog.md that declares which statuses are legal.
legend_label = "Status legend:"
