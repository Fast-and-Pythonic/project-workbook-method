# Packaging for the two tools, so a project can depend on a *version* of them instead of
# a path on somebody's machine.
#
#   pipx install git+https://github.com/Fast-and-Pythonic/project-workbook-method
#   workbook-lint  --config tools/lint_workbook.toml
#   workbook-index --config tools/lint_workbook.toml
#
# Why this exists at all: the standard is two different things, and the "never copy it"
# rule belongs to only one of them. RULES.md, FORMATS.md and METHODOLOGY.md are prose —
# copy those and the two copies drift until neither can be trusted. lint_workbook.py is code,
# and a copy of code is not a second source of truth, it is a version skew, which is a
# solved problem with ordinary release machinery. A project that pinned a version and
# installed it is in a better position than one pointing at ../../0_project-workbook-method.
#
# Running the scripts by path keeps working and is still what the projects' own _meta.md
# documents; nothing here moves a file.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workbook-lint"
version = "2.3.0"
description = "Linter and index generator for the Project Workbook standard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["documentation", "linter", "project-workbook"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
# No dependencies, deliberately. Both tools are standard library only, which is what lets
# them run anywhere a project is checked out without becoming a build step of their own.
dependencies = []

[project.urls]
Homepage = "https://github.com/Fast-and-Pythonic/project-workbook-method"

[project.scripts]
workbook-lint = "lint_workbook:main"
workbook-index = "make_index:main"
workbook-triggers = "check_triggers:main"

[tool.setuptools]
# The modules stay in tools/ rather than moving into a package directory: every
# consuming project's _meta.md documents `python <standard>/tools/lint_workbook.py`, and
# a package layout would invalidate all of them to gain nothing a user can see.
package-dir = { "" = "tools" }
py-modules = ["lint_workbook", "make_index", "check_triggers"]
